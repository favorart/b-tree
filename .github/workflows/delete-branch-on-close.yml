# Удаляет ветку PR, закрытого без мержа. Ветки смерженных PR GitHub удаляет сам (delete_branch_on_merge).
name: delete-branch-on-close

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: github.event.pull_request.merged == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BRANCH" = "$DEFAULT" ]; then exit 0; fi
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || echo "branch $BRANCH already gone"
