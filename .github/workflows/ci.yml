name: CI

on:
  push:
    branches: [ "master" ]
    # documentation does not need a build: no run, no tag, no release
    paths-ignore: [ "**.md", "docs/**", "LICENSE" ]
  pull_request:
    branches: [ "**" ]
    paths-ignore: [ "**.md", "docs/**", "LICENSE" ]

permissions:
  contents: read

# A new push to a PR cancels its previous run; master runs always finish (they tag).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # a push to master builds the release archives: the build jobs pack what they have built
  RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
        san: [ 0, 1 ]
    # the names are the required checks of the branch protection
    name: ${{ matrix.cc }}${{ matrix.san == 1 && ' + ASan/UBSan' || '' }}
    env:
      # the Makefile takes CC, SAN and CFLAGS from the environment
      CC: ${{ matrix.cc }}
      SAN: ${{ matrix.san }}
      CFLAGS: -O2 -g -Werror
      # the Linux archive comes from the plain gcc build
      PACK: ${{ matrix.cc == 'gcc' && matrix.san == 0 }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: the version of the coming tag
      if: env.RELEASE == 'true' && env.PACK == 'true'
      run: .github/next-version.sh >> "$GITHUB_ENV"
    - name: ASan of older compilers crashes at startup with high ASLR entropy
      if: matrix.san == 1
      run: sudo sysctl -w vm.mmap_rnd_bits=28
    - name: install cmocka
      # the runner's package index is usually fresh enough; update only if it is not
      run: |
        sudo apt-get install -y --no-install-recommends libcmocka-dev ||
          { sudo apt-get update && sudo apt-get install -y --no-install-recommends libcmocka-dev; }
    - name: build (warnings are errors)
      run: make -j4 all
    - name: demo
      run: ./build/mydb_demo /tmp/demo.db
    - name: tests
      env:
        MYDB_CRASH_ROUNDS: 8
      run: make -j4 test
    - name: pack
      if: env.RELEASE == 'true' && env.PACK == 'true'
      run: .github/pack.sh
    - uses: actions/upload-artifact@v5
      if: env.RELEASE == 'true' && env.PACK == 'true'
      with:
        name: mydb-${{ runner.os }}
        path: mydb-*.tar.gz
        if-no-files-found: error
        retention-days: 1

  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      CC: clang
      CFLAGS: -O2 -g -Werror
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: the version of the coming tag
      if: env.RELEASE == 'true'
      run: .github/next-version.sh >> "$GITHUB_ENV"
    - name: install cmocka
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: brew install cmocka pkg-config
    - name: build (warnings are errors)
      run: make -j4 all
    - name: tests
      run: make -j4 test
    - name: pack
      if: env.RELEASE == 'true'
      run: .github/pack.sh
    - uses: actions/upload-artifact@v5
      if: env.RELEASE == 'true'
      with:
        name: mydb-${{ runner.os }}
        path: mydb-*.tar.gz
        if-no-files-found: error
        retention-days: 1

  # informational, nothing is compared: only for master, the numbers go to the job summary
  benchmark:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - name: benchmark
      run: make -j4 bench BENCH_N=100000 | tee -a "$GITHUB_STEP_SUMMARY"

  # Tag a master commit that passed every check with the next patch version: v0.0.1, v0.0.2, ...
  # A minor or major bump is a tag pushed by hand; the numbering continues from it.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ linux, macos ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - id: tag
      run: |
        if git tag --points-at HEAD | grep -q '^v[0-9]'; then
          echo "HEAD is already tagged"; exit 0
        fi
        eval "$(.github/next-version.sh)"
        git tag "v$VERSION"
        git push origin "v$VERSION"
        echo "new_tag=v$VERSION" >> "$GITHUB_OUTPUT"

  # GitHub Release for the new tag with the archives of the build jobs; nothing is built here.
  # Only the 3 latest releases are kept (their tags stay).
  release:
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.tag.outputs.new_tag }}
    steps:
    - uses: actions/download-artifact@v5
      with:
        pattern: mydb-*
        merge-multiple: true
    - name: publish
      run: gh release create "$TAG" mydb-*.tar.gz --title "$TAG" --generate-notes
    - name: keep the 3 latest releases
      run: |
        gh release list --limit 100 --json tagName,createdAt \
          --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
        while read -r old; do
          gh release delete "$old" --yes
        done
